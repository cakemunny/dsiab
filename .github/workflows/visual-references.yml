# Takes the reference images for the image comparison in .storybook/visual.setup.ts, on the same runner and
# browser that CI checks them with. A reference image differs by browser and operating system, so no local
# machine can take one.
#
# Run it by hand from the Actions tab, or push a branch named `visual-references/<anything>`. It writes no
# commit. It uploads the images as the artifact `visual-references`, which a person downloads with
# `gh run download <run id> -n visual-references -D src` and commits.
#
# Take new references after an intended visual change. CI then compares every push against them.

name: visual-references

on:
  workflow_dispatch:
  push:
    branches: ["visual-references/**"]

permissions:
  contents: read

jobs:
  references:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      # `--update` writes every reference again, so an old image never survives a visual change.
      - name: Take the reference images
        run: npx vitest run --update
        env:
          DS_VISUAL: "1"

      - name: Upload the reference images
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-references
          path: src/**/__screenshots__/**/*-chromium-linux.png
          if-no-files-found: error
